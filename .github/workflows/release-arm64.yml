name: release-arm64

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0 ndk;29.0.14206865 cmake;3.22.1'

      - name: Build release (arm64-only)
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew :app:assembleRelease --stacktrace --console=plain 2>&1 | tee gradle.log

      - name: Surface failure publicly
        if: failure()
        run: |
          echo '### gradle.log (tail)' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -80 gradle.log >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -a -m5 -E "^e: |error:|FAILED|Could not|Caused by|What went wrong" gradle.log | sed 's/%/%25/g' | while IFS= read -r line; do echo "::error::$line"; done || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gradle-log
          path: gradle.log
          if-no-files-found: warn

      - name: Zip single APK
        run: |
          set -e
          ls -lh app/build/outputs/apk/release/
          test -f app/build/outputs/apk/release/app-release.apk
          zip -j ekm_ai-arm64-release.zip app/build/outputs/apk/release/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ekm_ai-arm64-release
          path: ekm_ai-arm64-release.zip
          if-no-files-found: error
          retention-days: 14
